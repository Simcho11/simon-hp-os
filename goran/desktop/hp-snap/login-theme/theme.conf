[SddmTheme]
Name=HP-OS
Description=HP-OS login screen
Type=sddm-theme
Author=iNiR project
Version=1.0
Website=https://github.com/snowarch/iNiR
Screenshot=
MainScript=Main.qml
ConfigFile=theme.conf

[General]
background=assets/background.png
defaultBackground=assets/background.png
blurRadius=50

# iNiR Material You colors — updated automatically by sync-pixel-sddm.py on wallpaper change
primaryColor=#cba6f7
onPrimaryColor=#1e1e2e
surfaceColor=#1e1e2e
surfaceContainerColor=#181825
onSurfaceColor=#cdd6f4
onSurfaceVariantColor=#9399b2
backgroundColor=#1e1e2e
errorColor=#f38ba8
materialShapeChars=false

appearance=iris
irisLoginStyle=studio
# Day and night wallpapers (the same pair as the desktop); the veil keeps white type readable on the light one.
irisPictureDay=hp-os-daybreak.jpg
irisPictureNight=hp-os-harmony-night.jpg
irisLiftDay=0.04
irisVeilDay=#0a2a6b
irisVeilNight=#000000
irisAccent=#8ab4ff
irisFontMain=HarmonyOS Sans
# HP-OS: the buttons' glass (clear, bright, quiet) and what sits behind the time (none, glow, soft).
irisGlassLook=clear
irisClockShade=none
# HP-OS: the Studio login's arrangement (horizon, card, editorial).
irisStudio=card
irisFontClock=Rubik
irisClockFormat=12h
