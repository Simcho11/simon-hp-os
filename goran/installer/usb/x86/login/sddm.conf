[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=xdg-shell,QT_QUICK_CONTROLS_STYLE=Basic,NO_AT_BRIDGE=1,QT_ACCESSIBILITY=0

[Theme]
ThemeDir=/opt/hp-os/login/themes
Current=hpos
CursorTheme=Adwaita
Font=Inter

[Wayland]
CompositorCommand=/opt/hp-os/login/greeter-compositor
SessionDir=/opt/hp-os/login/sessions

[X11]
SessionDir=/opt/hp-os/login/xsessions

[Users]
MinimumUid=1000
MaximumUid=60000
RememberLastUser=true
RememberLastSession=true

[Autologin]
User=
Session=hpos.desktop
Relogin=false
